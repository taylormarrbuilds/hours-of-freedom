# Deploys the static site to GitHub Pages on pushes to main.
# This workflow does not enable Pages. After merge, set
# Settings → Pages → Build and deployment → Source to GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js og.png favicon.ico .nojekyll _site/
          cp -a icons fonts _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
